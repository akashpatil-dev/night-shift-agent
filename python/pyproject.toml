[project]
name = "night-shift-agent"
version = "0.1.0"
description = "Night-Shift Agent - Python reference implementation"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.4"]

[project.scripts]
night-shift = "night_shift.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/night_shift"]

[tool.hatch.build.targets.wheel.sources]
"src/night_shift" = "night_shift"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
