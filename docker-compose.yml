services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nightshift
      POSTGRES_PASSWORD: nightshift
      POSTGRES_DB: nightshift
    ports:
      - "5432:5432"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - nightshift_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nightshift -d nightshift"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  nightshift_pg:
